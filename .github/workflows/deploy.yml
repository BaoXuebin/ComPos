name: Build and Push to ACR

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/compos:${{ github.ref_name }} \
            -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/compos:latest \
            .

      - name: Push images
        run: |
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/compos:${{ github.ref_name }}
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/compos:latest
